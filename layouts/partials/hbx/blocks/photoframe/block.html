{{- /* Custom landing block: auto-rotating frame of assets/media/group/*.jpg */ -}}
{{- $imgs := sort (resources.Match "media/group/*.jpg") "Name" -}}
{{- if $imgs }}
<section style="padding:1.5rem 0;">
  <div style="max-width:960px;margin:0 auto;padding:0 1rem;">
    <div id="photoframe" style="position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:12px;background:#000;">
    {{- range $i, $img := $imgs }}
      <img src="{{ $img.RelPermalink }}" loading="lazy" alt="Edri group photo {{ add $i 1 }}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:{{ cond (eq $i 0) "1" "0" }};transition:opacity 1s ease-in-out;">
    {{- end }}
    </div>
  </div>
</section>
<script>
(function(){var box=document.getElementById("photoframe");if(!box)return;var s=box.getElementsByTagName("img"),i=0;if(s.length<2)return;setInterval(function(){s[i].style.opacity="0";i=(i+1)%s.length;s[i].style.opacity="1";},5000);})();
</script>
{{- end -}}
